name: Test GEO-SOP

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q desktop_app.py web_app platforms tools
