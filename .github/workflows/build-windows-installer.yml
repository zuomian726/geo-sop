name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Optional GEO-SOP version override (defaults to version.py)"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve application version
        shell: pwsh
        run: |
          $requestedVersion = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            $requestedVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          }
          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            throw "Application version could not be resolved."
          }
          "APP_VERSION=$requestedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building GEO-SOP $requestedVersion"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build native desktop application
        shell: cmd
        env:
          CI: "1"
        run: build_windows_exe.bat

      - name: Verify bundled browser
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GEO-SOP\GEO-SOP.exe")) { throw "Native application was not created." }
          $browser = Get-ChildItem ".playwright-browsers" -Recurse -Filter "chrome.exe" | Select-Object -First 1
          if (-not $browser) { throw "Bundled Playwright Chromium was not found." }
          $env:PLAYWRIGHT_BROWSERS_PATH = (Resolve-Path ".playwright-browsers").Path
          $resolved = python -c "from browser_utils import _bundled_browser_candidates; paths = _bundled_browser_candidates(); assert paths, 'application browser resolver found no bundled Chromium'; print(paths[0])"
          if (-not (Test-Path $resolved)) { throw "Application browser resolver returned an invalid path: $resolved" }
          Write-Host "Chromium: $($browser.FullName)"
          Write-Host "Application resolver: $resolved"

      - name: Smoke test native application startup
        shell: pwsh
        run: |
          $bootLog = Join-Path $env:TEMP "geo_sop_boot.log"
          $smokeData = Join-Path $env:RUNNER_TEMP "geo-sop-smoke-data"
          Remove-Item $bootLog -Force -ErrorAction SilentlyContinue
          Remove-Item $smokeData -Recurse -Force -ErrorAction SilentlyContinue
          $env:GEO_DEBUG_BOOT = "1"
          $env:GEO_BOOT_LOG_PATH = $bootLog
          $env:GEO_FORCE_BROWSER = "1"
          $env:GEO_DATA_DIR = $smokeData
          $env:GEO_DESKTOP_MODE = "1"
          $env:GEO_REQUIRE_LOGIN = "0"
          $env:PYTHONPATH = "$pwd;$pwd\web_app"
          $process = Start-Process "dist\GEO-SOP\GEO-SOP.exe" -PassThru
          try {
            $port = $null
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($process.HasExited) {
                $log = if (Test-Path $bootLog) { Get-Content $bootLog -Raw } else { "boot log missing" }
                throw "Native application exited during startup. $log"
              }
              if (Test-Path $bootLog) {
                $log = Get-Content $bootLog -Raw
                if ($log -match "creating wsgi server 127\.0\.0\.1:(\d+)") {
                  $port = [int]$Matches[1]
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $port) {
              $log = if (Test-Path $bootLog) { Get-Content $bootLog -Raw } else { "boot log missing" }
              throw "Native application did not report its local server port. $log"
            }

            $response = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/dashboard" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $response -or $response.StatusCode -ne 200) {
              throw "Native application dashboard was not reachable."
            }
            if ($response.Content -notmatch "AI 平台品牌可见度工作台") {
              throw "Native application dashboard did not contain the product identity."
            }
            if (-not (Test-Path $smokeData)) {
              throw "Native application did not initialize its local data directory."
            }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-WebRequest "http://127.0.0.1:$port/dashboard" -UseBasicParsing -WebSession $session | Out-Null
            $browserBody = @{ browser_path = "C:\Program Files\Google\Chrome\Application\chrome.exe" } | ConvertTo-Json
            $saved = Invoke-RestMethod "http://127.0.0.1:$port/api/browser/config" -Method Post -ContentType "application/json" -Body $browserBody -WebSession $session
            if (-not $saved.success) { throw "Native application browser config save failed." }
            $browserConfig = Join-Path $smokeData "browser_config.json"
            if (-not (Test-Path $browserConfig)) { throw "Browser config was not written to the user data directory." }
            $installedConfig = Get-ChildItem "dist\GEO-SOP" -Recurse -Filter "browser_config.json" -ErrorAction SilentlyContinue
            if ($installedConfig) { throw "Browser config was written into the installed application directory." }
            Write-Host "Native startup smoke test passed on port $port."
            Get-Content $bootLog
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build setup EXE
        shell: cmd
        env:
          CI: "1"
        run: build_windows_installer.bat

      - name: Verify installer
        shell: pwsh
        run: |
          $file = Get-ChildItem release\GEO-SOP-Setup-v*.exe | Select-Object -First 1
          if (-not $file) { throw "Installer EXE was not created." }
          Write-Host "Installer: $($file.FullName)"
          Write-Host "Size: $($file.Length)"
          if ($file.Length -lt 50000000) { throw "Installer is unexpectedly small; native runtime or Chromium may be missing." }
          Get-FileHash $file.FullName -Algorithm SHA256

      - name: Smoke test installer install and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\GEO-SOP-Setup-v*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP "geo-sop-installed"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          if (-not (Test-Path "$installDir\GEO-SOP.exe")) { throw "Installed application executable was not found." }
          $browser = Get-ChildItem "$installDir\ms-playwright" -Recurse -Filter "chrome.exe" | Select-Object -First 1
          if (-not $browser) { throw "Installed application is missing bundled Chromium." }
          $protocol = Get-ItemProperty "HKCU:\Software\Classes\geo-sop\shell\open\command" -ErrorAction Stop
          if ($protocol.'(default)' -notmatch "GEO-SOP.exe") { throw "geo-sop protocol registration is invalid." }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Installer did not create an uninstaller." }
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          Write-Host "Windows installer install/uninstall smoke test passed."

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GEO-SOP-Windows-Setup
          path: release/GEO-SOP-Setup-v*.exe
